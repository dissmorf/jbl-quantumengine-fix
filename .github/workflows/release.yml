name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          dotnet publish patcher -c Release -o dist
          Copy-Item scripts\* dist
          Copy-Item README.md, README.ru.md, LICENSE dist
          $zip = "QEWirelessFix-$version.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash)  $zip" | Out-File "$zip.sha256" -Encoding ascii
          Get-Content "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: QEWirelessFix
          path: QEWirelessFix-*.zip*

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            QEWirelessFix-*.zip
            QEWirelessFix-*.zip.sha256
